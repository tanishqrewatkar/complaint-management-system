<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Complaint Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Navigation -->
  <nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">HelpDesk | Grievance Portal</h1>
      <span class="text-xs bg-indigo-800 text-indigo-200 px-3 py-1 rounded-full font-medium">Public Submission</span>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto my-10 p-6 bg-white rounded-xl shadow-sm border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-900 mb-2">Register a New Complaint</h2>
    <p class="text-slate-500 mb-6 text-sm">Fill in the details below. You will receive an immediate confirmation upon submission.</p>

    <!-- Success / Error Notice Box -->
    <div id="alertBox" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <form id="complaintForm" class="space-y-4">
      <!-- Your Web3Forms Access Key -->
      <input type="hidden" name="access_key" value="c6bc7189-b145-4799-9188-fd9931300a62" />
      <input type="hidden" name="subject" value="New Grievance Registered - HelpDesk Portal" />
      <input type="hidden" name="from_name" value="Complaint Portal Bot" />
      <input type="hidden" id="trackingIdInput" name="Tracking_ID" value="" />

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
          <input type="text" name="Complainant_Name" required placeholder="e.g. Rahul Sharma"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email / Phone</label>
          <input type="text" name="Contact_Details" required placeholder="name@example.com or phone"
            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
          <select name="Complaint_Category" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">Select Category</option>
            <option value="Electricity / Power">Electricity / Power</option>
            <option value="Water Supply">Water Supply</option>
            <option value="Roads & Infrastructure">Roads & Infrastructure</option>
            <option value="Sanitation & Waste">Sanitation & Waste</option>
            <option value="Academic / College">Academic / College</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Priority Level</label>
          <select name="Priority_Level" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Complaint Title</label>
        <input type="text" name="Complaint_Title" required placeholder="Short summary of the issue"
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Detailed Description</label>
        <textarea name="Complaint_Description" rows="4" required placeholder="Describe the issue in detail"
          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition">
        Submit Grievance
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
